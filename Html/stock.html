<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../Images/efrei.png">
    <title>2Bis - Stock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500&family=Oswald:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/style_stock.css">
</head>
<body>
    <header class="navbar">
        <div class="logos">
            <span class="logo-efrei">eFrei</span>
            <a href="Home.html" class="logo-2bis">2Bis</a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="Home.html">HOME</a></li>
                <li><a href="stock.html" class="active">STOCK</a></li>
                <li><a href="agenda.html">AGENDA</a></li>
                <li><a href="team.html">TEAM</a></li>
                <li><a href="about.html">ABOUT</a></li>
            </ul>
        </nav>
        <form class="search" role="search">
            <input type="search" aria-label="Rechercher">
            <button type="submit" aria-label="Rechercher">
                <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </form>
    </header>

    <main>
        <div class="title-row">
            <h1>Stocks:</h1>
            <button class="btn-add" id="btn-add" type="button" aria-label="Ajouter un article au stock">+</button>
        </div>

        <section class="stock-panel" aria-label="Tableau des stocks">
            <!-- Petite barre en haut à droite du tableau : filtre les lignes -->
            <div class="stock-tools">
                <span class="stock-count" id="stock-count"></span>
                <input type="search" id="filtre" class="filtre" placeholder="Filtrer…" aria-label="Filtrer le stock">
            </div>

            <div class="table-wrap">
                <table class="stock">
                    <thead>
                        <tr>
                            <th scope="col"><button type="button" class="sort" data-cle="item">Item:</button></th>
                            <th scope="col"><button type="button" class="sort" data-cle="quantite">Quantité:</button></th>
                            <th scope="col"><button type="button" class="sort" data-cle="zone">Zone Associée:</button></th>
                            <th scope="col"><button type="button" class="sort" data-cle="date">Date achat:</button></th>
                            <th scope="col" class="col-actions"><span class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody id="stock-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Bulle d'ajout / modification -->
    <div class="overlay" id="overlay" hidden>
        <form class="bubble" id="form-stock" role="dialog" aria-modal="true" aria-labelledby="bubble-title" novalidate>
            <button class="bubble-close" type="button" aria-label="Fermer">&times;</button>
            <h2 id="bubble-title">Ajouter au stock</h2>

            <label class="field">
                <span>Item</span>
                <input type="text" name="article" required maxlength="40" autocomplete="off">
            </label>

            <div class="field-row">
                <label class="field">
                    <span>Quantité</span>
                    <input type="number" name="quantite" required min="0" max="99999" step="1" value="1">
                </label>
                <label class="field">
                    <span>Zone associée</span>
                    <input type="text" name="zone" required maxlength="30" list="liste-zones" autocomplete="off">
                    <datalist id="liste-zones"></datalist>
                </label>
                <label class="field">
                    <span>Date d'achat</span>
                    <input type="date" name="date" required>
                </label>
            </div>

            <p class="form-error" id="form-error" role="alert"></p>
            <button class="btn-submit" id="btn-submit" type="submit">Ajouter au stock</button>
        </form>
    </div>

    <!-- Message d'annulation après suppression -->
    <div class="toast" id="toast" role="status" hidden>
        <span id="toast-text"></span>
        <button type="button" id="toast-undo">Annuler</button>
    </div>

    <footer class="footer">
        <span class="footer-logo">eFrei</span>
        <address>
            <p>2Bis Paris :</p>
            <p><a href="tel:+33188289001">+33 188 289 001</a></p>
            <p><a href="mailto:2Bis@paris.net">2Bis@paris.net</a></p>
            <p>30-32 Av. de la République, 94800 Villejuif</p>
        </address>
    </footer>

    <script src="../js/search.js"></script>
    <script src="../js/stock.js"></script>
</body>
</html>
