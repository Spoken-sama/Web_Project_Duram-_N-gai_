<!-- Déclaration du type de document et début de la structure HTML -->
<!doctype html>
<html>

	<!-- Balise head contenant les métadonnées et le lien vers la feuille de style -->
	<head>
		<link rel="stylesheet" type="text/css" href="../Css/style_stock.css">
		<title>Stock</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- Style pour la classe nav -->
		<style>.nav {
			text-decoration: none;
			color: white;
		}

		</style>
	</head>

	<!-- Balise body, corps de la page HTML -->
	<body> <!-- Ici est la page des stocks-->

		<!-- Balise nav, barre de navigation -->
		<nav>

			<!-- Conteneur fixe de la barre de navigation -->
			<div class="sticky">
			 	<!-- Liste non ordonnée avec plusieurs éléments de navigation -->
				<ul>
					<!-- Logo de l'efrei -->
					<li class="logo">
						<img src="../Images/efrei.png" width="100%">
					</li>
					<!-- Nom du site -->
					<li class="titre">2Bis</li>
			 		<!-- Élément de navigation vers la page d'accueil -->
			 		<li>
			 			<a class="nav" href="Home.html">HOME</a>
			 		</li>
			 		<!-- Élément de navigation vers la page des stocks -->
			 		<li>
				 		<a class="nav" href="stock.html">STOCK</a>
					</li>
				 	<!-- Élément de navigation vers la page de l'agenda -->
				 	<li>
				 		<a class="nav" href="agenda.html">AGENDA</a>
				 	</li>
				 	<!-- Élément de navigation vers la page de l'équipe -->
				 	<li>
				 		<a class="nav" href="team.html">TEAM</a>
				 	</li>
				 	<!-- Élément de navigation vers la page à propos -->
				 	<li>
				 		<a class="nav" href="about.html">ABOUT</a>
				 	</li>
				 	<!-- Barre de recherche avec la loupe -->
				 	<li class="recherche">
				 		<input type="text" name="recherche"><img src="../Images/loupe.png" class="loupe">
				 	</li>
			 	</ul>
			 	<!-- Fin de la liste -->
			</div>

			<!-- Conteneur relatif et absolu -->
			<div class="relative_absolute">
				<!-- Titre de la page -->
				<div class="absolute1"><p style="font-size: 85px; font-family: Georgia, serif;" class="titre_page">Stocks:</p></div>

				<!-- Tableau des stocks -->
				<div class="absolute2">
					<table class="stock">
						<!-- Première ligne avec le nom des colonnes -->
						<tr class="entete">
							<td style="width: 20.5%;">Item:</td>
							<td style="width: 20.3%;">Quantité:</td>
							<td style="width: 22.6%;">Zone Associé:</td>
							<td style="width: 36.6%;" class="derniere">Date achat:</td>
						</tr>
						<!-- Deuxième ligne avec un objet du stock -->
						<tr class="objet">
							<td>Coussin</td>
							<td>x20</td>
							<td>Chambres</td>
							<td class="derniere">20/10/2025</td>
						</tr>
						<!-- Ligne vide pour remplir le reste du tableau -->
						<tr>
							<td></td>
							<td></td>
							<td></td>
							<td class="derniere"></td>
						</tr>
					</table>
				</div>

				<!-- Petite barre en haut à droite du tableau -->
				<div class="absolute3"><input type="text" name="ajout"></div>
			</div>
		</nav>

		<!-- Balise de pied de page -->
		<footer></footer>

		<!-- Tableau contenant les informations de contact de l'hôtel -->
		<table>
    		<tr>
       		 <!-- Première colonne contenant le logo de l'efrei -->
       		 <td style="width: 20%; text-align: center">
        		    <img id="contact" src="../Images/efrei.png" alt="Logo efrei">
        	 </td>

        	 <!-- Deuxième colonne contenant l'adresse, le téléphone et le mail -->
        	 <td style="width: 80%;">
            		<p>2Bis Paris :</p>
            		<p>+33 188 289 001</p>
            		<p>2Bis@paris.net</p>
            		<p>30-32 Av. de la République, 94800 Villejuif</p>
        	 </td>
    		</tr>
		</table>
	<!-- Fin du corps de la page HTML -->
	</body>
</html>
